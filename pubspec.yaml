name: proexpense_tracker
description: "Professional Flutter Expense Tracker with Analytics, PDF Export, and Security Features"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Database & Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  
  # Charts and graphs
  fl_chart: ^0.69.0
  
  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.1
  
  # Sharing files
  share_plus: ^10.1.2
  
  # File picker for import/export
  file_picker: ^8.1.4
  
  # CSV & Excel export
  csv: ^6.0.0
  excel: ^4.0.6
  
  # Date formatting
  intl: ^0.19.0
  
  # Security (Biometric & Local Auth)
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  
  # State Management
  provider: ^6.1.2
  
  # UUID for unique IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
