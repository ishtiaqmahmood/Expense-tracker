name: proexpense_tracker
description: "Professional Flutter Expense Tracker with Advanced Analytics, PDF Export, Biometric Security, and Cloud Backup"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Database & Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts and graphs - Premium visuals
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.50
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  
  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.1
  
  # Sharing files
  share_plus: ^10.1.2
  
  # File picker for import/export
  file_picker: ^8.1.4
  
  # CSV & Excel export
  csv: ^6.0.0
  excel: ^4.0.6
  
  # Date formatting
  intl: ^0.19.0
  
  # Security (Biometric, PIN, Encryption)
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  
  # State Management
  provider: ^6.1.2
  get: ^4.6.6
  
  # UUID for unique IDs
  uuid: ^4.5.1
  
  # Image handling for receipts
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Connectivity check
  connectivity_plus: ^6.1.2
  
  # Device info for Play Store
  device_info_plus: ^11.1.1
  
  
  # Currency conversion
  http: ^1.2.2
  
  # Calendar view
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
